services:
  redash:
    build: ../
    command: manage version
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: 0
      REDASH_LOG_LEVEL: "INFO"
      REDASH_REDIS_URL: "redis://redis:6379/0"
      POSTGRES_PASSWORD: "FmTKs5vX52ufKR1rd8tn4MoSP7zvCJwb"
      REDASH_DATABASE_URL: "postgresql://postgres:FmTKs5vX52ufKR1rd8tn4MoSP7zvCJwb@postgres/postgres"
      # Passed through from the caller's environment only when it is set (CI
      # generates a fresh ephemeral value per run, locally:
      # `export REDASH_COOKIE_SECRET=$(openssl rand -hex 32)`). No value is
      # committed here, and when the caller supplies nothing the variable is
      # omitted from the container so Redash fails closed at startup.
      REDASH_COOKIE_SECRET:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    command: "postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=OFF"
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"

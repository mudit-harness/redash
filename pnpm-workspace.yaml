packages:
  - "viz-lib"

# Wait at least 7 days (10080 minutes) before a newly published version of a
# package is eligible for installation, to reduce exposure to compromised or
# unstable releases. Requires pnpm >= 10.16.0.
minimumReleaseAge: 10080

# Refuse transitive dependencies resolved from untrusted, non-registry sources
# (git, GitHub, remote tarball, file or link specifiers), which bypass registry
# integrity checks. Requires pnpm >= 10.26.0.
blockExoticSubdeps: true

# Refuse resolutions that would weaken the trust and provenance settings
# already recorded for a package, so a malicious update cannot downgrade them.
# Requires pnpm >= 10.21.0.
trustPolicy: no-downgrade

onlyBuiltDependencies:
  - "sql-formatter"
  - "core-js"
  - "core-js-pure"
  - "cypress"
  - "es5-ext"
  - "less"
  - "puppeteer"
  - "unrs-resolver"
